name: CI & Daily Automated Health Check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Runs daily at 01:00 UTC (9:00 AM CST)
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  test-desktop-substrate:
    name: Substrate Tests (${{ matrix.os }} - Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Substrate Core Unit Tests (44+ tests)
        run: npx tsx --test desktop/*.test.ts

      - name: Validate Markdown Skill Hub SOPs
        run: npx tsx --test desktop/skill-hub.test.ts

      - name: Compile and Build Web App
        run: npm run build

  test-python-sdk:
    name: Python SDK (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python SDK
        run: |
          cd sdk/python
          pip install -e .

      - name: Validate Syntax & Bytecode Compilation
        run: |
          python -m py_compile sdk/python/ghostdesk/client.py sdk/python/examples/langgraph_agent.py sdk/python/examples/crewai_worker.py
