name: Build M5Stack CoreS3 Firmware

on:
  push:
    paths:
      - 'firmware/m5stack_cores3/**'
      - '.github/workflows/firmware-cores3.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Build M5Stack CoreS3 Firmware
        run: |
          cd firmware/m5stack_cores3
          pio run

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: m5stack-cores3-firmware
          path: |
            firmware/m5stack_cores3/.pio/build/m5stack-cores3/firmware.bin
            firmware/m5stack_cores3/.pio/build/m5stack-cores3/bootloader.bin
            firmware/m5stack_cores3/.pio/build/m5stack-cores3/partitions.bin
