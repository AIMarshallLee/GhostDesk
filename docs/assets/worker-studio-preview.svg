        <text x="28" y="322" fill="#a7f3d0">[14:20:07] [Step 3/4] 正在批量写入订单 SKU 数据...</text>
        <text x="28" y="342" fill="#e879f9">[14:20:08] [Watchdog] 步进心跳正常 · 自愈反思器已就绪</text>
        <text x="28" y="362" fill="#38bdf8">[14:20:09] ── 累计节省 VLM Token: 1,400 ──</text>
