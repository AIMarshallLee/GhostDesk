[env:m5stack-cores3]
platform = espressif32
board = esp32s3box
framework = arduino
monitor_speed = 115200

board_build.partitions = partitions.csv
board_upload.flash_size = 16MB

build_flags = 
    -D ARDUINO_USB_MODE=0
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D BOARD_HAS_PSRAM
    -D CORE_DEBUG_LEVEL=0

lib_deps = 
    m5stack/M5Unified @ ^0.1.16
