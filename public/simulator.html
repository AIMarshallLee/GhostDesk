<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self';"><title>FlowDesk 本地聊天模拟器</title><link rel="stylesheet" href="./simulator.css"></head>
<body>
  <main class="shell">
    <aside class="sidebar"><div class="brand"><span>FD</span><div><strong>FlowDesk</strong><small>本地测试模拟器</small></div></div><div class="test-note">所有人名、订单和消息均为虚构测试数据，仅保存在本地。</div><div id="conversation-list" class="conversation-list" aria-label="测试会话列表"></div><div class="side-footer"><span id="connection" class="connection">正在连接…</span><button id="reset" class="text-button" aria-label="重置测试数据">重置测试</button></div></aside>
    <section class="chat"><header class="chat-head"><div><p class="eyebrow">沙箱会话</p><h1 id="chat-title">选择测试会话</h1><p id="chat-topic" class="muted">不会向真实客户发送任何消息</p></div><div><div id="conversation-mode" class="badge">测试中</div><button id="takeover" class="text-button" aria-label="切换人工接管">人工接管</button></div></header><div id="message-list" class="message-list" aria-live="polite"></div><form id="message-form" class="composer"><label class="sr-only" for="message-input">模拟客户消息</label><textarea id="message-input" rows="2" maxlength="2000" placeholder="以客户身份发送一条测试消息…"></textarea><button id="send-message" type="submit">发送测试消息</button></form></section>
    <aside class="status"><header><p class="eyebrow">回复控制</p><h2>测试运行状态</h2></header><div class="status-card"><div class="status-line"><span id="engine-dot" class="dot"></span><strong id="engine-status">未连接</strong></div><p id="engine-detail" class="muted">读取后台状态中</p><label class="field">回复方式<select id="reply-mode" aria-label="回复方式"><option value="auto">自动回复</option><option value="manual">人工复制回复</option></select></label><label class="field">生成引擎<select id="mode" aria-label="生成引擎"><option value="rules">测试规则（不调用 AI）</option><option value="live">真实模型（仅测试会话）</option></select></label><div class="controls"><button id="start" aria-label="启动回复流程">启动</button><button id="pause" class="secondary" aria-label="暂停回复流程">暂停</button><button id="stop" class="secondary" aria-label="停止回复流程">停止</button></div></div><div class="metrics"><div><small>已接收</small><strong id="stat-received">—</strong></div><div><small>已发送</small><strong id="stat-sent">—</strong></div><div><small>重复</small><strong id="stat-duplicates">—</strong></div><div><small>失败</small><strong id="stat-failed">—</strong></div><div><small>人工接管</small><strong id="stat-handoff">—</strong></div><div><small>待处理</small><strong id="stat-pending">—</strong></div></div><section class="panel"><h3>故障与时序测试</h3><div class="faults"><label>生成失败次数<input id="fault-generate" type="number" min="0" value="0"></label><label>发送失败次数<input id="fault-send" type="number" min="0" value="0"></label><label>ACK 丢失次数<input id="fault-ack" type="number" min="0" value="0"></label><label>生成延迟 ms<input id="fault-delay" type="number" min="0" value="0"></label></div><button id="apply-faults" class="secondary">应用故障设置</button></section><section class="panel"><h3>一键测试样例 <small>每项样例会重置此模拟器的测试数据</small></h3><div class="sample-grid"><button data-sample="burst">连续 3 条</button><button data-sample="multi">多会话各 1 条</button><button data-sample="duplicate">重复 ID</button><button data-sample="ack">ACK 丢失</button><button data-sample="failure">生成故障</button><button data-sample="delay">延迟后暂停</button></div><p id="sample-result" class="muted">预期结果：后台计数和事件会反映实际执行结果。</p></section><section class="panel"><h3>任务与事件</h3><div id="jobs" class="jobs"></div><div id="events" class="events"></div></section></aside>
  </main><dialog id="live-dialog" aria-labelledby="live-title"><h2 id="live-title">允许本次真实模型测试？</h2><p>仅会发送当前本地虚构会话文本到已配置 provider。</p><p id="live-provider" class="muted"></p><div class="controls"><button id="live-cancel" class="secondary" type="button">取消</button><button id="live-allow" type="button">允许本次测试</button></div></dialog><div id="toast" role="status" aria-live="polite"></div><script src="./simulator.js" defer></script>
</body></html>
