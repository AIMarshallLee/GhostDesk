[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostdesk"
version = "1.0.0"
description = "Official Python SDK for GhostDesk: Hardware-in-the-Loop Desktop AI Employee Substrate for Windows & macOS"
readme = "README.md"
requires-python = ">=3.8"
license = "Apache-2.0"
authors = [
    { name = "GhostDesk Contributors", email = "ghostdesk@users.noreply.github.com" }
]
keywords = ["computer-use", "hardware-hid", "pico-rp2040", "desktop-automation", "langgraph", "crewai", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Hardware",
]
dependencies = [
    "httpx>=0.24.0",
    "pydantic>=2.0.0"
]

[project.urls]
Homepage = "https://github.com/AIMarshallLee/GhostDesk"
Repository = "https://github.com/AIMarshallLee/GhostDesk"
Documentation = "https://github.com/AIMarshallLee/GhostDesk#readme"
