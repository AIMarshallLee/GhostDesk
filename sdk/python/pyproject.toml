[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostdesk"
version = "1.0.0"
description = "Python SDK for GhostDesk: Hardware-in-the-Loop Desktop AI Employee Substrate for Windows"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
    { name = "GhostDesk Contributors", email = "ghostdesk@users.noreply.github.com" }
]
dependencies = [
    "httpx>=0.24.0",
    "pydantic>=2.0.0"
]

[project.urls]
Homepage = "https://github.com/AIMarshallLee/GhostDesk"
Repository = "https://github.com/AIMarshallLee/GhostDesk"
